<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 관리 시스템</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        h2 {
            color: #444;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }

        form {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
<h1>도서 관리 시스템</h1>
<div>
    <h2>도서 등록</h2>
<!--    :  제목(title), 저자(author), ISBN(isbn), 가격(price), :  type=”text”-->
<!--    출판일(publishDate) : type=”date”-->

    <form>
        <label for="title">제목:</label>
        <input type="text" name="title" id="title" required>

        <label for="author">저자:</label>
        <input type="text" name="author" id="author" required>

        <label for="isbn">ISBN:</label>
        <input type="text" name="isbn" id="isbn" required>

        <label for="price">가격:</label>
        <input type="text" name="price" id="price" required>

        <label for="publishDate">출판일:</label>
        <input type="date" name="publishDate" id="publishDate">

        <button type="submit">학생 등록</button>

    </form>
</div>

<div>
    <h2>도서 리스트</h2>
    <table>
        <thead>
        <tr>
            <th>제목</th>
            <th>저자</th>
            <th>ISBN</th>
            <th>가격</th>
            <th>출판일</th>
            <th>액션</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
</body>
</html>
